<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chat 3D</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .link { margin-top: 15px; display: block; color: #38bdf8; text-decoration: none; font-size: 14px; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar no Chat 3D</h2>
        <form id="loginForm">
            <input type="text" id="nome" placeholder="Seu Nome de Usuário" required>
            <input type="password" id="senha" placeholder="Sua Senha" required>
            <button type="submit">Entrar</button>
        </form>
        <a href="cadastro.html" class="link">Não tem uma conta? Cadastre-se</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const senha = document.getElementById('senha').value;

            socket.emit('login_account', { nome, senha });
        });

        socket.on('login_success', (user) => {
            localStorage.setItem('chat_user', JSON.stringify(user));
            window.location.href = 'chat.html';
        });

        socket.on('login_error', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>

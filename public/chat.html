<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Principal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #0f172a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        /* Barra Lateral de Perfil */
        .sidebar-perfil {
            width: 320px;
            background-color: #0f172a;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
        }
        
        /* Botão dos três tracinhos (Hambúrguer) */
        .menu-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 22px;
            padding: 0;
            margin-bottom: 15px;
        }
        .menu-toggle-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #38bdf8;
            border-radius: 2px;
            transition: 0.3s;
        }
        .menu-toggle-btn:hover span {
            background-color: #ffffff;
        }

        /* Estado Recolhido (Abre e Fecha o perfil) */
        .sidebar-perfil.recolhido {
            width: 70px !important;
            padding: 20px 10px;
        }
        .sidebar-perfil.recolhido .conteudo-perfil {
            display: none;
        }

        /* Área de Chat / Comunidade */
        .chat-area {
            flex: 1;
            background-color: #0b0f19;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .perfil-card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .info-item {
            margin-bottom: 10px;
            font-size: 15px;
        }
        .info-item strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" fill="#ffffff" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            <span id="welcomeUser">Bem-vindo, usuário</span>
        </div>
        <div>
            <button onclick="limparConversa()" style="background:#ef4444; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer; margin-right: 10px;">Limpar Conversa</button>
            <button onclick="sair()" style="background:#334155; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer;">Sair</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Barra Lateral de Perfil com o botão de três tracinhos adicionado -->
        <div class="sidebar-perfil" id="sidebarPerfil">
            <button class="menu-toggle-btn" onclick="togglePerfil()" title="Recolher/Expandir Perfil">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="conteudo-perfil">
                <h3 style="color: #38bdf8; margin-top:0;">Seu Perfil &amp; Info</h3>
                <img src="" id="perfilFoto" class="perfil-card-img" alt="Foto de Perfil" onerror="this.src='https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&auto=format&fit=crop&q=60'">
                
                <div class="info-item"><strong>Idade:</strong> <span id="perfilIdade">--</span></div>
                <div class="info-item"><strong>Endereço:</strong> <span id="perfilEndereco">--</span></div>
                <div class="info-item"><strong>Cor:</strong> <span id="perfilCor">--</span></div>
                <div class="info-item"><strong>Altura/Peso:</strong> <span id="perfilAlturaPeso">--</span></div>
            </div>
        </div>

        <!-- Área de Chat e Usuários -->
        <div class="chat-area">
            <h2 style="color: #ffffff; margin-top:0;">Usuários Cadastrados na Comunidade</h2>
            <div id="chatMessages" style="flex:1; overflow-y:auto; margin-bottom: 20px;">
                <!-- Suas mensagens e painel de chat aqui -->
            </div>
        </div>
    </div>

    <script>
        // Função para abrir e fechar o perfil
        function togglePerfil() {
            const sidebar = document.getElementById('sidebarPerfil');
            sidebar.classList.toggle('recolhido');
        }

        function limparConversa() {
            if(confirm('Deseja realmente limpar a conversa?')) {
                document.getElementById('chatMessages').innerHTML = '';
            }
        }

        function sair() {
            localStorage.removeItem('chat_user');
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('chat_user');
            if(userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if(user.nome) {
                        document.getElementById('welcomeUser').innerText = 'Bem-vindo, ' + user.nome;
                    }
                } catch(e) {}
            }
        });
    </script>
</body>
</html>

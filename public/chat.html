<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Principal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #0f172a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        /* Barra Lateral de Perfil */
        .sidebar-perfil {
            width: 300px;
            background-color: #0f172a;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
            transition: width 0.3s ease, padding 0.3s ease, transform 0.3s ease;
            position: relative;
        }
        
        /* Botão dos três tracinhos (Hambúrguer) */
        .menu-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 22px;
            padding: 0;
            margin-bottom: 15px;
        }
        .menu-toggle-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #38bdf8;
            border-radius: 2px;
            transition: 0.3s;
        }
        .menu-toggle-btn:hover span {
            background-color: #ffffff;
        }

        /* Estado Recolhido */
        .sidebar-perfil.recolhido {
            width: 70px !important;
            padding: 20px 10px;
        }
        .sidebar-perfil.recolhido .conteudo-perfil {
            display: none;
        }

        /* Foto de Perfil Formato 3x4 (Vertical) */
        .perfil-card-img {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin: 0 auto 10px auto;
            display: block;
            border: 2px solid #38bdf8;
        }

        /* Botão Editar Foto com Emoji */
        .btn-editar-foto {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
            transition: 0.2s;
        }
        .btn-editar-foto:hover {
            opacity: 0.9;
        }

        /* Input file oculto para galeria */
        #inputFotoFile {
            display: none;
        }

        /* Área de Chat / Comunidade */
        .chat-area {
            flex: 1;
            background-color: #0b0f19;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .info-item {
            margin-bottom: 10px;
            font-size: 14px;
            word-break: break-word;
        }
        .info-item strong {
            color: #38bdf8;
        }

        /* Modo Responsivo Automático para Celular (Estilo App) */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar-perfil {
                width: 100% !important;
                height: 60px;
                padding: 10px 15px;
                overflow: hidden;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                border-right: none;
                flex-shrink: 0;
            }
            .sidebar-perfil.recolhido {
                height: 60px !important;
                width: 100% !important;
            }
            .sidebar-perfil:not(.recolhido) {
                height: 65vh;
                width: 100% !important;
            }
            .sidebar-perfil:not(.recolhido) .conteudo-perfil {
                display: block;
            }
            .menu-toggle-btn {
                position: absolute;
                top: 15px;
                right: 20px;
            }
            .chat-area {
                flex: 1;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" fill="#ffffff" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            <span id="welcomeUser">Bem-vindo, usuário</span>
        </div>
        <div>
            <button onclick="limparConversa()" style="background:#ef4444; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer; margin-right: 5px; font-size: 13px;">Limpar</button>
            <button onclick="sair()" style="background:#334155; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer; font-size: 13px;">Sair</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Barra Lateral de Perfil -->
        <div class="sidebar-perfil" id="sidebarPerfil">
            <!-- Botão dos três tracinhos para abrir/fechar -->
            <button class="menu-toggle-btn" onclick="togglePerfil()" title="Recolher/Expandir Perfil">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="conteudo-perfil">
                <h3 style="color: #38bdf8; margin-top:0;">Seu Perfil &amp; Info</h3>
                
                <!-- Foto em Formato 3x4 -->
                <img src="" id="perfilFoto" class="perfil-card-img" alt="Foto 3x4" onerror="this.src='https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&auto=format&fit=crop&q=60'">
                
                <!-- Botão Editar Foto com Emoji de Lápis -->
                <button class="btn-editar-foto" onclick="document.getElementById('inputFotoFile').click()">✏️ Editar Foto</button>
                <input type="file" id="inputFotoFile" accept="image/*" onchange="atualizarFotoPerfil(event)">

                <div class="info-item"><strong>Idade:</strong> <span id="perfilIdade">--</span></div>
                <div class="info-item"><strong>Endereço:</strong> <span id="perfilEndereco">--</span></div>
                <div class="info-item"><strong>Cor:</strong> <span id="perfilCor">--</span></div>
                <div class="info-item"><strong>Altura/Peso:</strong> <span id="perfilAlturaPeso">--</span></div>
                <div class="info-item" style="margin-top: 15px;"><strong>Sobre:</strong> <br><span id="perfilObservacao">--</span></div>
            </div>
        </div>

        <!-- Área de Chat e Usuários -->
        <div class="chat-area">
            <h2 style="color: #ffffff; margin-top:0; font-size: 20px;">Usuários Cadastrados na Comunidade</h2>
            <div id="chatMessages" style="flex:1; overflow-y:auto; margin-bottom: 20px;">
                <!-- Suas mensagens e painel de chat aqui -->
            </div>
        </div>
    </div>

    <script>
        function togglePerfil() {
            const sidebar = document.getElementById('sidebarPerfil');
            sidebar.classList.toggle('recolhido');
        }

        // Função para atualizar o status do usuário na lista global e na sessão
        function atualizarStatusGlobal(status) {
            const userStr = localStorage.getItem('chat_user');
            if(userStr) {
                try {
                    const user = JSON.parse(userStr);
                    user.status = status;
                    localStorage.setItem('chat_user', JSON.stringify(user));

                    // Atualiza também na lista geral de usuários cadastrados para o painel admin
                    let listaUsuarios = JSON.parse(localStorage.getItem('lista_usuarios') || '[]');
                    const index = listaUsuarios.findIndex(u => u.nome === user.nome || u.id === user.id);
                    if(index !== -1) {
                        listaUsuarios[index].status = status;
                    } else {
                        listaUsuarios.push(user);
                    }
                    localStorage.setItem('lista_usuarios', JSON.stringify(listaUsuarios));
                } catch(e) {}
            }
        }

        // Reconhecimento automático de dispositivo móvel e marcação como Online
        window.addEventListener('DOMContentLoaded', () => {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            const sidebar = document.getElementById('sidebarPerfil');
            
            if (isMobile) {
                sidebar.classList.add('recolhido'); // Inicia recolhido no celular estilo app
            } else {
                sidebar.classList.remove('recolhido'); // No PC abre expandido
            }

            // Marcar automaticamente como online ao entrar no chat
            atualizarStatusGlobal('online');

            // Carregar dados salvos do usuário
            const userStr = localStorage.getItem('chat_user');
            if(userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if(user.nome) document.getElementById('welcomeUser').innerText = 'Bem-vindo, ' + user.nome;
                    if(user.idade) document.getElementById('perfilIdade').innerText = user.idade;
                    if(user.endereco) document.getElementById('perfilEndereco').innerText = user.endereco;
                    if(user.cor) document.getElementById('perfilCor').innerText = user.cor;
                    if(user.alturaPeso) document.getElementById('perfilAlturaPeso').innerText = user.alturaPeso;
                    if(user.observacao) document.getElementById('perfilObservacao').innerText = user.observacao;
                    if(user.foto) document.getElementById('perfilFoto').src = user.foto;
                } catch(e) {}
            }
        });

        // Marcar como offline ao fechar a aba ou navegador
        window.addEventListener('beforeunload', () => {
            atualizarStatusGlobal('offline');
        });

        // Função para alterar a foto chamando a galeria do celular
        function atualizarFotoPerfil(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    document.getElementById('perfilFoto').src = base64Image;
                    
                    // Salvar alteração no localStorage e atualizar status online
                    const userStr = localStorage.getItem('chat_user');
                    if(userStr) {
                        try {
                            const user = JSON.parse(userStr);
                            user.foto = base64Image;
                            user.status = 'online';
                            localStorage.setItem('chat_user', JSON.stringify(user));
                            atualizarStatusGlobal('online');
                        } catch(err) {}
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function limparConversa() {
            if(confirm('Deseja realmente limpar a conversa?')) {
                document.getElementById('chatMessages').innerHTML = '';
            }
        }

        function sair() {
            atualizarStatusGlobal('offline');
            localStorage.removeItem('chat_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

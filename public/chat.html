<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Principal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #0f172a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        /* Barra Lateral de Perfil */
        .sidebar-perfil {
            width: 300px;
            background-color: #0f172a;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
        }
        
        .menu-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 22px;
            padding: 0;
            margin-bottom: 15px;
        }
        .menu-toggle-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #38bdf8;
            border-radius: 2px;
            transition: 0.3s;
        }

        .sidebar-perfil.recolhido {
            width: 70px !important;
            padding: 20px 10px;
        }
        .sidebar-perfil.recolhido .conteudo-perfil {
            display: none;
        }

        .perfil-card-img {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin: 0 auto 10px auto;
            display: block;
            border: 2px solid #38bdf8;
        }

        .btn-editar-foto {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
        }
        .btn-editar-foto:hover { opacity: 0.9; }
        #inputFotoFile { display: none; }

        /* Área de Comunidade / Usuários */
        .chat-area {
            flex: 1;
            background-color: #0b0f19;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .lista-usuarios-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .user-card {
            background-color: #1e293b;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .user-card:hover { border-color: #38bdf8; }

        .user-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            left: 32px;
            width: 12px;
            height: 12px;
            background-color: #94a3b8;
            border-radius: 50%;
            border: 2px solid #1e293b;
        }
        .status-dot.online { background-color: #22c55e; }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-conversar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
        }
        .btn-conversar:hover { opacity: 0.9; }

        /* Modal / Janela de Chat Privado */
        #chatModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .chat-modal-content {
            background: #0f172a;
            width: 500px;
            height: 600px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-modal-header {
            background: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chat-messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0b0f19;
        }
        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }
        .message-bubble.sent {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }
        .message-bubble.received {
            background: #334155;
            color: white;
            align-self: flex-start;
        }
        .chat-input-area {
            padding: 15px;
            background: #1e293b;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .chat-input-area input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .chat-input-area button {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .info-item {
            margin-bottom: 10px;
            font-size: 14px;
            word-break: break-word;
        }
        .info-item strong { color: #38bdf8; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar-perfil {
                width: 100% !important;
                height: 60px;
                padding: 10px 15px;
                overflow: hidden;
            }
            .sidebar-perfil.recolhido { height: 60px !important; }
            .sidebar-perfil:not(.recolhido) { height: 60vh; }
            .chat-modal-content { width: 95%; height: 80vh; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" fill="#ffffff" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            <span id="welcomeUser">Bem-vindo, usuário</span>
        </div>
        <div>
            <button onclick="sair()" style="background:#334155; border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer; font-size: 13px;">Sair</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Barra Lateral de Perfil -->
        <div class="sidebar-perfil" id="sidebarPerfil">
            <button class="menu-toggle-btn" onclick="togglePerfil()" title="Recolher/Expandir Perfil">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="conteudo-perfil">
                <h3 style="color: #38bdf8; margin-top:0;">Seu Perfil &amp; Info</h3>
                
                <img src="" id="perfilFoto" class="perfil-card-img" alt="Foto 3x4" onerror="this.src='https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&auto=format&fit=crop&q=60'">
                
                <button class="btn-editar-foto" onclick="document.getElementById('inputFotoFile').click()">✏️ Editar Foto</button>
                <input type="file" id="inputFotoFile" accept="image/*" onchange="atualizarFotoPerfil(event)">

                <div class="info-item"><strong>Idade:</strong> <span id="perfilIdade">--</span></div>
                <div class="info-item"><strong>Endereço:</strong> <span id="perfilEndereco">--</span></div>
                <div class="info-item"><strong>Cor:</strong> <span id="perfilCor">--</span></div>
                <div class="info-item"><strong>Altura/Peso:</strong> <span id="perfilAlturaPeso">--</span></div>
                <div class="info-item" style="margin-top: 15px;"><strong>Sobre:</strong> <br><span id="perfilObservacao">--</span></div>
            </div>
        </div>

        <!-- Área de Comunidade e Lista de Usuários -->
        <div class="chat-area">
            <h2 style="color: #ffffff; margin-top:0; font-size: 20px;">Usuários Cadastrados na Comunidade</h2>
            <div id="listaUsuariosContainer" class="lista-usuarios-grid"></div>
        </div>
    </div>

    <!-- Modal de Chat Privado -->
    <div id="chatModal">
        <div class="chat-modal-content">
            <div class="chat-modal-header">
                <h3 id="chatModalTitle" style="margin: 0; color: #38bdf8; font-size: 16px;">Chat</h3>
                <button onclick="fecharChat()" style="background:transparent; border:none; color:white; font-size:18px; cursor:pointer;">✖</button>
            </div>
            <div id="chatMessagesBox" class="chat-messages-box"></div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentTargetSocketId = null;
        let currentTargetName = '';

        function togglePerfil() {
            const sidebar = document.getElementById('sidebarPerfil');
            sidebar.classList.toggle('recolhido');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            if (isMobile) {
                document.getElementById('sidebarPerfil').classList.add('recolhido');
            }

            const userStr = localStorage.getItem('chat_user');
            if(userStr) {
                try {
                    currentUser = JSON.parse(userStr);
                    if(currentUser.nome) document.getElementById('welcomeUser').innerText = 'Bem-vindo, ' + currentUser.nome;
                    if(currentUser.idade) document.getElementById('perfilIdade').innerText = currentUser.idade;
                    if(currentUser.endereco) document.getElementById('perfilEndereco').innerText = currentUser.endereco;
                    if(currentUser.cor) document.getElementById('perfilCor').innerText = currentUser.cor;
                    if(currentUser.alturaPeso) document.getElementById('perfilAlturaPeso').innerText = currentUser.alturaPeso;
                    if(currentUser.observacao) document.getElementById('perfilObservacao').innerText = currentUser.observacao;
                    if(currentUser.foto) document.getElementById('perfilFoto').src = currentUser.foto;

                    socket.emit('user_connected_chat', currentUser);
                } catch(e) {}
            }

            socket.emit('get_initial_config');
        });

        socket.on('update_users_list', (usersList) => {
            renderizarUsuarios(usersList);
        });

        function renderizarUsuarios(usersList) {
            const container = document.getElementById('listaUsuariosContainer');
            container.innerHTML = '';

            if(!usersList || usersList.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">Nenhum usuário cadastrado no momento.</p>';
                return;
            }

            usersList.forEach(u => {
                if (currentUser && u.nome.toLowerCase() === currentUser.nome.toLowerCase()) return;

                const card = document.createElement('div');
                card.className = 'user-card';

                const fotoPerfil = u.foto && u.foto !== '' ? u.foto : 'https://via.placeholder.com/150?text=Sem+Foto';
                const isOnline = u.isOnline || u.status === 'online';
                const statusClass = isOnline ? 'status-dot online' : 'status-dot';

                card.innerHTML = `
                    <div class="user-info-left">
                        <img src="${fotoPerfil}" class="user-avatar" alt="Foto">
                        <span class="${statusClass}" title="${isOnline ? 'Online' : 'Offline'}"></span>
                        <span class="user-name">${u.nome}</span>
                    </div>
                    <button class="btn-conversar" onclick="abrirChat('${u.id || ''}', '${u.nome}')">💬 Conversar</button>
                `;
                container.appendChild(card);
            });
        }

        function abrirChat(targetSocketId, targetName) {
            currentTargetSocketId = targetSocketId;
            currentTargetName = targetName;
            document.getElementById('chatModalTitle').innerText = 'Conversando com ' + targetName;
            document.getElementById('chatMessagesBox').innerHTML = '';
            document.getElementById('chatModal').style.display = 'flex';
        }

        function fecharChat() {
            document.getElementById('chatModal').style.display = 'none';
        }

        function enviarMensagem() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            socket.emit('send_private_message', {
                targetSocketId: currentTargetSocketId,
                targetName: currentTargetName,
                text: text
            });

            input.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                enviarMensagem();
            }
        }

        socket.on('receive_private_message', (msg) => {
            const box = document.getElementById('chatMessagesBox');
            const bubble = document.createElement('div');
            
            // Se a mensagem foi enviada por mim ou recebida
            const isMe = currentUser && msg.senderName.toLowerCase() === currentUser.nome.toLowerCase();
            bubble.className = isMe ? 'message-bubble sent' : 'message-bubble received';
            bubble.innerHTML = `<strong>${msg.senderName}:</strong> ${msg.text}`;
            
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        });

        function atualizarFotoPerfil(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    document.getElementById('perfilFoto').src = base64Image;
                    
                    if(currentUser) {
                        currentUser.foto = base64Image;
                        localStorage.setItem('chat_user', JSON.stringify(currentUser));
                        socket.emit('update_photo', base64Image);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function sair() {
            if(currentUser) {
                socket.emit('user_logout', currentUser.nome);
            }
            localStorage.removeItem('chat_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

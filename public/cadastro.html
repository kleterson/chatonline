<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Chat 3D</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .link { text-align: center; margin-top: 15px; display: block; color: #38bdf8; text-decoration: none; font-size: 14px; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Nova Conta</h2>
        <form id="registerForm" autocomplete="off">
            <input type="text" id="nome" placeholder="Seu Nome de Usuário" autocomplete="off" required>
            <input type="password" id="senha" placeholder="Crie uma Senha" autocomplete="new-password" required>
            <input type="number" id="idade" placeholder="Idade" autocomplete="off" required>
            <input type="text" id="endereco" placeholder="Endereço / Cidade" autocomplete="off" required>
            <input type="text" id="alturaPeso" placeholder="Altura e Peso (Ex: 1.75m, 70kg)" autocomplete="off" required>
            <input type="text" id="cor" placeholder="Cor (Pele/Olhos/Cabelo)" autocomplete="off" required>
            <textarea id="observacao" placeholder="Sobre você: o que gosta, música favorita..." rows="3" required></textarea>
            <button type="submit">Finalizar Cadastro</button>
        </form>
        <a href="index.html" class="link">Já possui uma conta? Faça o login</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const userData = {
                nome: document.getElementById('nome').value,
                senha: document.getElementById('senha').value,
                idade: document.getElementById('idade').value,
                endereco: document.getElementById('endereco').value,
                alturaPeso: document.getElementById('alturaPeso').value,
                cor: document.getElementById('cor').value,
                observacao: document.getElementById('observacao').value
            };

            socket.emit('register_account', userData);
        });

        socket.on('register_success', (user) => {
            alert('Cadastro realizado com sucesso! Faça login para entrar.');
            window.location.href = 'index.html';
        });

        socket.on('register_error', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
